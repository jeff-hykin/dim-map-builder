<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- dim-app first-paint (dim-app vendor.js keeps this block current): the theme's page color before any CSS or JS
             loads, so the app never flashes white. Portal (dark) #05070d, Research (light) paper #f5f4ef; Desktop's saved
             theme (localStorage "portal.theme"; a light skin is Research), as theme.js picks, else Portal. -->
        <style>
            html {
                background: #05070d;
                color-scheme: dark;
            }
            html[data-dim-first-paint="light"] {
                background: #f5f4ef;
                color-scheme: light;
            }
        </style>
        <script>
            try {
                const skin = localStorage.getItem("portal.theme")
                if (["research", "vibeslop-light", "solarpunk"].includes(skin)) {
                    document.documentElement.dataset.dimFirstPaint = "light"
                }
            } catch {
                // storage unavailable: Portal
            }
        </script>
        <!-- /dim-app first-paint -->
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="light dark" />
        <link rel="icon" href="./icon.svg" />
        <title>Map Editor</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./src/main.tsx"></script>
    </body>
</html>
