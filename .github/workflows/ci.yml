name: ci
on:
    push:
    pull_request:
    workflow_dispatch:
jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            # pulls from the dimos-nix-cache R2 bucket (where this pushes), then dimos-desktop.cachix.org (older builds)
            - uses: cachix/install-nix-action@v31
              with:
                  extra_nix_config: |
                      extra-substituters = https://pub-18ed8210d82a4563a7e7269c4ce48a1c.r2.dev https://dimos-desktop.cachix.org
                      extra-trusted-public-keys = dimos-nix-cache-1:f6JE9qRFzxGAbwEYBxRkB7LsSYvIVv9BXfhsRm0kqPk= dimos-desktop.cachix.org-1:A4P35aGJGmCan92LWyamtSFXMqaVE+VRFYnrJ8QMTeQ=
            - run: nix build .#dimosApp -L
            # builds every prebuilt dimos.yaml's nix.cache lists for this runner's system (--no-link: ./result stays the native build); on a push to the default branch or a tag, pushes each and fails unless it's in the cache
            - run: |
                  system=$(nix eval --impure --raw --expr builtins.currentSystem)
                  if [ "$CHECK_CACHE" = true ] && [ -z "$NIX_SIGNING_KEY" ]; then echo "::error::NIX_SIGNING_KEY isn't set: this push's prebuilts won't reach the cache"; exit 1; fi
                  failed=0
                  for attr in $(grep -oE "packages\.$system\.[A-Za-z0-9_+-]+" dimos.yaml | sort -u); do
                      out=$(nix build --no-link --print-out-paths ".#$attr" -L) || { echo "::error::.#$attr didn't build"; failed=1; continue; }
                      if [ "$CHECK_CACHE" = true ]; then
                          key=$(mktemp) && printf '%s' "$NIX_SIGNING_KEY" > "$key"
                          nix copy --to "s3://dimos-nix-cache?endpoint=$R2_CACHE_ENDPOINT&region=auto&secret-key=$key" "$out"
                          rm -f "$key"
                          curl -sfI "https://pub-18ed8210d82a4563a7e7269c4ce48a1c.r2.dev/$(basename "$out" | cut -c1-32).narinfo" > /dev/null || { echo "::error::.#$attr ($out) isn't in the R2 cache"; exit 1; }
                      fi
                  done
                  # and the native .#dimosApp, which is what Desktop builds on a system dimos.yaml lists nothing for
                  if [ "$CHECK_CACHE" = true ]; then
                      out=$(readlink -f result)
                      key=$(mktemp) && printf '%s' "$NIX_SIGNING_KEY" > "$key"
                      nix copy --to "s3://dimos-nix-cache?endpoint=$R2_CACHE_ENDPOINT&region=auto&secret-key=$key" "$out"
                      rm -f "$key"
                      curl -sfI "https://pub-18ed8210d82a4563a7e7269c4ce48a1c.r2.dev/$(basename "$out" | cut -c1-32).narinfo" > /dev/null || { echo "::error::.#dimosApp ($out) isn't in the R2 cache"; exit 1; }
                  fi
                  exit $failed
              env:
                  R2_CACHE_ENDPOINT: ${{ vars.R2_CACHE_ENDPOINT }}
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
                  CHECK_CACHE: ${{ github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/')) }}
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.5.0
            # dimos.yaml's provides: is exactly what the built server serves at openapi.json
            - run: deno task check-endpoints --binary result/bin/dimos-app-server
            - run: deno fmt --check && deno lint
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - run: cargo test --workspace --locked
            # the page's deno: the version the flake builds it with (nixos-25.11's), whose deno.lock this is
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.6.10
            # typecheck, then the shared map's packing (Share → as HTML: voxel encoding and page round trips) and the 2D view's gestures
            - run: deno install --frozen && deno task typecheck && deno task test
              working-directory: frontend
