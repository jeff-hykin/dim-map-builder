[package]
name = "mapping"
version = "0.1.0"
edition = "2021"
description = "The Map Editor's map math: ray-traced voxel map (the dimos crate), tf, loop closure, cleanup, floor plans"
license = "Apache-2.0"

[dependencies]
ahash = "0.8"
anyhow = "1"
arrayvec = "0.7"
kiddo = "5"
kornia-apriltag = "0.1.10"
kornia-image = "0.1.14"
# kornia-apriltag's resize, for the ArUco detector's quads
kornia-imgproc = "0.1.14"
nalgebra = "0.33"
png = "0.17"
rayon = "1"
# the .rrd the global map step can write (no viewer, just the SDK that encodes recordings)
rerun = { version = "0.32", default-features = false, features = ["sdk"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zune-jpeg = "0.5.15"

dimos-recording = { path = "../dimos-recording" }
# the ray-traced voxel map, from dimos main (move to crates.io once it is published there)
dimos-voxel-ray-tracing = { git = "https://github.com/dimensionalOS/dimos", rev = "17fdb6b945da617acc37038297f0caa8b5297fac" }
# lidar + IMU odometry (Generate's step 0): dimSLAM's filter; without CUVSLAM_SDK_DIR its cu_vslam_rs is the SDK-less stub
dim_slam = { git = "https://github.com/dimensionalOS/dimSLAM", rev = "b6323a5f6e3781cae524fa905e031e285311bb51" }
# the ray tracer's Config derives this crate's Validate
validator = "0.21"

[dev-dependencies]
tempfile = "3"
