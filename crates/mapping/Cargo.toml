[package]
name = "mapping"
version = "0.1.0"
edition = "2021"
description = "The Map Editor's map math: ray-traced voxel map (the dimos crate), tf, loop closure, cleanup, floor plans"
license = "Apache-2.0"

[dependencies]
ahash = "0.8"
anyhow = "1"
arrayvec = "0.7"
kiddo = "5"
kornia-apriltag = "0.1.10"
kornia-image = "0.1.14"
# kornia-apriltag's resize, for the ArUco detector's quads
kornia-imgproc = "0.1.14"
nalgebra = "0.33"
png = "0.17"
rayon = "1"
# the .rrd the global map step can write (no viewer, just the SDK that encodes recordings)
rerun = { version = "0.32", default-features = false, features = ["sdk"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zune-jpeg = "0.5.15"

dimos-recording = { path = "../dimos-recording" }
# the ray-traced voxel map, from dimos main (move to crates.io once it is published there)
dimos-voxel-ray-tracing = { git = "https://github.com/dimensionalOS/dimos", rev = "509d0b57ac175a282e47362f4a7485603ef03d89" }
# Point-LIO (lidar + IMU odometry), the estimator dimos's dimos-pointlio wraps at the same dimos rev as the ray tracer
# (its Cargo.toml pins this rev); dimos-pointlio itself is an LCM module with nothing offline to call
pointlio-core = { git = "https://github.com/dimensionalOS/dimos-module-pointlio.git", rev = "22a5403f827d030b248ae473c2808b5d405b3d55" }
# the ray tracer's Config derives this crate's Validate
validator = "0.21"

[dev-dependencies]
tempfile = "3"
