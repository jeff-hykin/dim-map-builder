[workspace]
resolver = "2"
members = ["crates/dimos-recording", "crates/mapping", "server"]

[profile.release]
opt-level = 3
lto = "thin"

# the map build is all float math over millions of points: optimize it even in debug builds
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.mapping]
opt-level = 3
