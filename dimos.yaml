title: Map Editor
spec-version: v1.0 # the dimos.yaml spec version this file follows
uses:
    # Dimensional cloud: who is logged in (logging in is Desktop's Settings → Dimensional account) and queue uploads of
    # the recording (these need a Desktop with cloud uploads; an older Desktop doesn't serve them, so it won't install
    # this version).
    "@dimos-gateway":
        - GET /cloud/account
        - GET /cloud/uploads
        - POST /cloud/uploads
        - DELETE /cloud/uploads
    # Desktop's shared recordings folder: the recording picker lists it and reads each recording's streams.
    "@desktop-gateway":
        - GET /recordings
        - GET /recordings/{id}
        - POST /api/notifications
    # the dim-app SDK's zenoh client (backend state, events): the zenoh bridge and how it finds it
    "@zenoh-gateway": ">=0.5 <0.6"
# Desktop's nix builds of this app pull from this cache (CI fills it)
caches:
    - url: https://dimos-desktop.cachix.org
      key: "dimos-desktop.cachix.org-1:A4P35aGJGmCan92LWyamtSFXMqaVE+VRFYnrJ8QMTeQ="
provides:
    # what its server answers only its own pages (its endpoints: below are the public API)
    private:
        - api/state/*
        - api/captures/*
        - api/sessions/*
        - api/ui/*
        - api/events/*
        - GET api/browse # the Open panel's file browser: lists any folder on this machine
    when: 'you need to build, clean or annotate a 3D map from a recording'
    description: >-
        Map Editor: build, clean, annotate and save a 3D voxel map of a robot's recording, in the 'map' frame: meters,
        +z up, the floor of the main storey near z = 0 once levelled. Session routes take {id}: `current` is the
        recording open in the page. Workflow: GET api/view (where the user is looking + a labelled screenshot) or GET
        api/status (bounds, floors) -> query / find-objects to locate things by geometry -> fit-box for a tight box
        around what's in a rough region (add=true adds it). fit-box keeps the connected piece nearest the region's
        center, so center the rough region on the object you mean: a generous region is fine. Trust fit-box's extents
        over a screenshot. Edits are undoable (POST .../undo) and show up in the page immediately. A region is "view"
        (what the user sees now), "all", or a box {center:[x,y,z], size:[dx,dy,dz], yaw}.
    endpoints:
        -
            method: GET
            path: api/status
            when: you need a quick summary of the open map before working on it
            description: >-
                The open map, briefly: session id, recording, stage (raw = not built yet / map), odometryPending (a
                lidar + IMU recording with no odometry: why Generate runs Point-LIO first), recordedMap (the recording's
                own global_map stream, which POST .../generate/recorded-map makes the map without generating), voxel
                count, bounds, floors, annotation counts, running job, what can be undone, unsaved edits, recent
                history.
            params:
                session:
                    type: string
                    description: 'session id (default: the recording open in the page)'
            role: context
        -
            method: GET
            path: api/state
            when: 'you need to know which recording is open, or which was open last'
            description: >-
                What the page loads: { active (the open session id, or null), session (its full state: annotations,
                plans, job, history...), last (when nothing is open: the session open before a restart, offered, not
                loaded), recordingsDir (Desktop's recordings folder) }. Only a recording opened since the server started
                is open.
        -
            method: POST
            path: api/open
            when: you need to open a recording in the Map Editor
            description: >-
                Open a recording (.mcap / .db) in the Map Editor: every open page switches to it (its saved map and
                edits come back). path = absolute path (Desktop's GET /recordings lists them) or relative to the
                recordings folder. Returns the session's full state (as GET api/sessions/{id}) at once: only the
                recording's index is read (an .mcap's summary, a .db's stream list). An .mcap with no summary (cut
                short) is read in the background as an open job (job: bytes read / total, ETA, cancel); GET
                api/sessions/{id}/generate answers 202 with it until it's done.
            params:
                path:
                    type: string
                    description: the recording file
                    required: true
                name:
                    type: string
                    description: display name
                id:
                    type: string
                    description: Desktop's recording id
                writable:
                    type: boolean
                    description: 'false for a read-only folder: saving is refused, recordings are never copied (default true)'
        -
            method: GET
            path: api/build-defaults
            when: you want the default options before building a map
            description: >-
                The default map build options (voxelSize, loopClosure, rayTracing, every, maxRange, tfTolerance,
                worldFrame, cloudStream, ray, pgo), as an object POST .../build takes.
        -
            method: GET
            path: api/view
            when: you need to see what the user is looking at in the 3D view
            description: >-
                What the user is looking at: camera position/target, the map-frame bounds of the visible voxels
                (visibleBounds), the selection, the page's ui (mode, tool, planFloor, look), and (screenshot=true,
                default) a screenshot of the 3D view with a 1 m grid, axis labels and annotation labels drawn on it
                (images[0]).
            params:
                screenshot:
                    type: boolean
                    description: include a screenshot (default true)
                topDown:
                    type: boolean
                    description: >-
                        screenshot from straight above the current target instead of the user's angle (the user's camera
                        is restored after)
                session:
                    type: string
                    description: 'session id (default: the recording open in the page)'
            role: view
        -
            method: POST
            path: api/camera
            when: you want to point the user's camera at a spot on the map
            description: 'Move the user''s camera (every open page) to look at a point in the map frame. Returns { ok: true }.'
            params:
                target:
                    type: array
                    items:
                        type: number
                    description: 'the point to look at, [x, y, z] map-frame meters'
                    required: true
                distance:
                    type: number
                    description: meters from the target
                topDown:
                    type: boolean
                    description: look straight down
        -
            method: PATCH
            path: api/ui
            when: 'you need to switch the page''s mode, tool or display options'
            description: >-
                Change what the page shows (every open page follows; kept with the session): mode (3d | split | 2d),
                tool (select | erase | brush | line | straighten | polygon | places | annotate | clean | views),
                planFloor (the storey the 2D view works on), paletteOpen, floorOverlay, showPaths {corrected, raw,
                loops}, look {style: voxel | disc | square | splat, gradient, scale}, scope (view | region | all), slice
                ([zStart, zEnd] over the local floor). An unknown field is a 400. Returns { ok, applied }.
            params:
                mode:
                    type: string
                    description: 3d | split | 2d
                tool:
                    type: string
                    description: >-
                        palette tool: select | erase | brush | line | straighten | polygon | places | annotate | clean |
                        views
                planFloor:
                    type: integer
                    description: storey index the 2D view works on
                paletteOpen:
                    type: boolean
                    description: show the tool palette
                floorOverlay:
                    type: boolean
                    description: draw the local floor model over the map
                showPaths:
                    type: object
                    description: 'which trajectories to draw: {corrected, raw, loops} booleans'
                look:
                    type: object
                    description: 'how voxels are drawn: {style: voxel | disc | square | splat, gradient, scale}'
                scope:
                    type: string
                    description: 'what the clean-up tools act on: view | region | all'
                slice:
                    type: object
                    description: '[zStart, zEnd] meters over the local floor'
        -
            method: GET
            path: 'api/sessions/{id}'
            when: you need every detail of a session's state
            description: >-
                A session's full state: recording, stage, build summary and options, transform, annotations, floor
                plans, job, history, undo/redo labels, unsaved, voxel counts, bounds.
            params:
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: DELETE
            path: 'api/sessions/{id}'
            when: you want to throw away a session's map and edits and start over
            description: >-
                Discard the working copy: its built map and edits (start over; the recording file is untouched). Returns
                { ok: true }.
            params:
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: GET
            path: 'api/sessions/{id}/paths'
            when: 'you need the path the robot drove, raw or loop-closure corrected'
            description: 'The robot''s trajectory in the map frame: { raw, corrected, loops } (loop closures as point pairs).'
            params:
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/build'
            when: you need to build or rebuild the 3D map from the recording
            description: >-
                Start (re)building the global map from the recording (loop closure + ray tracing). A recording with a
                lidar + IMU and no odometry (status odometryPending set) gets Point-LIO first, in place (as POST
                .../generate/odometry): odometry on the tf and /pointlio_odometry, deskewed scans. Runs in the
                background: returns { job }; poll GET api/status (job) or watch the page. Every option is optional (GET
                api/build-defaults; nested ray / pgo / tfTolerance pass through too).
            params:
                voxelSize:
                    type: number
                    description: 'voxel edge, meters'
                loopClosure:
                    type: boolean
                    description: correct drift with loop closure (pose graph optimization)
                rayTracing:
                    type: boolean
                    description: 'ray trace the scans so free space clears what moved; false keeps every return, just voxelized'
                every:
                    type: integer
                    description: use every n-th scan (1 = all)
                maxRange:
                    type: number
                    description: 'ignore lidar returns farther than this, meters'
                cloudStream:
                    type: string
                    description: 'the point cloud stream (default: the cloud stream with the most messages)'
                worldFrame:
                    type: string
                    description: 'the fixed frame (default: world, map or odom, whichever places the clouds)'
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: DELETE
            path: 'api/sessions/{id}/job'
            when: 'you want to stop a running build, save or generation step'
            description: >-
                Cancel the running job (build, preview, save, or a generation step). Returns { cancelled } (false when
                nothing was running).
            params:
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: GET
            path: 'api/sessions/{id}/generate'
            when: you need to see which generation steps a recording has done and what each would run with
            description: >-
                The generation steps for the open recording (202 + { job } while what they need is read in the
                background: an open job, or a big .mcap's tf in a read job or the preview's first stage; ask again when
                that job ends): what it has (image / CameraInfo streams, raw_april_tags and april_tags counts and marker
                ids, the tf tree analyzed: frames, which edges move, cloud streams and the default one to correct, the
                edge the correction would write, whether a corrected tf is in it and is stale, global_map_aggregated /
                .pc2.lcm / .rrd), each step's defaults (and the marker dictionaries step 1 knows) and what each ran with
                last.
            params:
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/generate/odometry'
            when: >-
                you need odometry for a lidar + IMU recording that has none, before correcting its tf or building its
                map
            description: >-
                Step 0, Point-LIO, in the background, for a lidar + IMU recording with no odometry whose lidar nothing
                in tf moves (GET .../generate odometry.needed): dimos's Point-LIO estimator over the lidar and the IMU
                (its prefix's, else the only one; accelerations in m/s² or g, told apart by their norm; the lidar → IMU
                extrinsic from tf when it connects them), written into the recording in place: odom → <the lidar tree's
                root> on the tf, /pointlio_odometry, and in an .mcap the deskewed scans on /pointlio_lidar (derived_from
                the raw lidar, which the later steps then use). The tags / tf / global-map steps take pointLio: true to
                run it first.
            params:
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/generate/tags'
            when: you need AprilTag or ArUco marker sightings (raw or grouped per marker) written into a recording
            description: >-
                Step 1, fiducial markers from images, in the background: every image of the camera stream through the
                marker detector (an AprilTag family or an OpenCV ArUco dictionary, by its OpenCV name:
                DICT_APRILTAG_36h11 by default, DICT_4X4_50 .. DICT_7X7_1000, DICT_ARUCO_ORIGINAL, ...; 10 cm; posed
                with the recording's CameraInfo), written into the recording: raw_april_tags (every glimpse with its
                quality diagnostics) and/or april_tags (gated, grouped per marker visit). Options (all optional): raw,
                grouped, cameraStream, cameraInfoStream, markerLength, dictionary, exclude (marker ids left out of the
                grouped stream), every, gates {...}, grouping {...}.
            params:
                raw:
                    type: boolean
                    description: write raw_april_tags (default true)
                grouped:
                    type: boolean
                    description: write april_tags (default true)
                cameraStream:
                    type: string
                    description: ''
                cameraInfoStream:
                    type: string
                    description: ''
                markerLength:
                    type: number
                    description: m
                dictionary:
                    type: string
                    description: >-
                        OpenCV name: DICT_APRILTAG_36h11 (default) | DICT_APRILTAG_36h10 | _25h9 | _16h5 | DICT_4X4_50
                        .. DICT_7X7_1000 | DICT_ARUCO_ORIGINAL | DICT_ARUCO_MIP_36h12
                exclude:
                    type: array
                    items:
                        type: number
                    description: marker ids on moving things
                pointLio:
                    type: boolean
                    description: run Point-LIO first when the recording needs it (step 0)
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/generate/tf'
            when: you need a loop-closure-corrected tf tree written into a recording
            description: >-
                Step 2, a corrected tf tree, in the background: loop closure over the trajectory of a point cloud's
                sensor, written into the recording's tf as the edge above the odometry (grandparent → parent, e.g. world
                → odom; replaced if it's there). quality fast = the app's loop closure, high = icp_stitch (ICP
                stitching). useTags adds AprilTag landmarks (runs step 1 first when the recording has no
                raw_april_tags). Options: cloudStream, sensorFrame (for a cloud in its tree's root frame), grandparent
                (name when there's none, default world), useTags, excludeTags, quality, stitch {closureSpacing,
                icpRadiusM, icpMinDtS, ...}, rateHz.
            params:
                cloudStream:
                    type: string
                    description: 'default: the scans whose frame moves, nearest the root of the biggest tree'
                sensorFrame:
                    type: string
                    description: ''
                grandparent:
                    type: string
                    description: ''
                useTags:
                    type: boolean
                    description: ''
                excludeTags:
                    type: array
                    items:
                        type: number
                    description: ''
                quality:
                    type: string
                    description: fast | high
                stitch:
                    type: object
                pointLio:
                    type: boolean
                    description: run Point-LIO first when the recording needs it (step 0)
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/generate/global-map'
            when: you need the corrected global map built and written into a recording
            description: >-
                Step 3, the global map, in the background: built through the corrected tf (useCorrectedTf, default true:
                runs step 2 first when the recording has none) with ray tracing, decimated, written into the recording
                as global_map_aggregated (one cloud at its start) and beside it as <name>_global_map_aggregated.pc2.lcm;
                it becomes the map in the editor. Options: useCorrectedTf, build {voxelSize, rayTracing, ray {...},
                ...}, decimation {voxel, removeOutliers, neighbors, stdRatio}, rrd {enabled, streams [{name, enabled,
                hz}], map, tags, trajectory} (an .rrd beside the recording).
            params:
                useCorrectedTf:
                    type: boolean
                    description: default true
                build:
                    type: object
                decimation:
                    type: object
                rrd:
                    type: object
                pointLio:
                    type: boolean
                    description: run Point-LIO first when the recording needs it (step 0)
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/generate/recorded-map'
            when: the recording already has a global_map and you want it as the map without generating one
            description: >-
                Skip Generate: the newest message of the recording's own global_map PointCloud2 (status recordedMap:
                dimos's global_map stream, /global_map or <namespace>/global_map) becomes the map, in its own frame, in
                the background. A voxel map keeps its points (its spacing is the voxel size); a denser cloud is thinned
                to 5 cm. Nothing is written into the recording. Options: stream (default: recordedMap), voxelSize (m;
                thin to it).
            params:
                stream:
                    type: string
                    description: 'the cloud stream to take the newest message of (default: the recording''s global_map)'
                voxelSize:
                    type: number
                    description: 'thin the map to this voxel, meters (default: keep a voxel map as it is)'
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/op'
            when: 'you need to remove noise, floor, walls or a region from the map'
            description: >-
                Clean up or crop (undoable). op: floating (small disconnected clusters; params.minVoxels, default 30),
                outliers (statistical; params.neighbors default 20, params.stdRatio default 2), floor (the floor
                surface; params.thickness), walls (vertical surfaces; params.minHeight, default 0.3), keepWalls
                (everything but walls), cropOutside (keep only a box region), deleteInside (remove a box region),
                cropHeight (keep params.zMin..params.zMax). Returns { label, changed (voxels removed), remaining };
                preview=true only counts (and adds preview: the points it would remove).
            params:
                op:
                    type: string
                    description: floating | outliers | floor | walls | keepWalls | cropOutside | deleteInside | cropHeight
                    required: true
                region:
                    description: '"view" (the user''s current camera view), "all" (default), or a box {center, size, yaw}'
                    anyOf:
                        -
                            type: string
                            enum:
                                - view
                                - all
                        -
                            type: object
                            description: an oriented box in map-frame meters
                            properties:
                                center:
                                    type: array
                                    items:
                                        type: number
                                    minItems: 3
                                    maxItems: 3
                                size:
                                    type: array
                                    items:
                                        type: number
                                    minItems: 3
                                    maxItems: 3
                                    description: 'full extents along the box''s x, y, z'
                                yaw:
                                    type: number
                                    description: radians about +z (default 0)
                            required:
                                - center
                                - size
                params:
                    type: object
                    description: 'the op''s tunables: minVoxels, neighbors, stdRatio, thickness, minHeight, zMin, zMax (see above)'
                preview:
                    type: boolean
                    description: 'only count what it would remove, change nothing'
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/transform'
            when: 'you need to rotate, level or reposition the map'
            description: >-
                Orient the map (undoable; annotations move with it): kind=rotate spins it about +z through its center by
                degrees; kind=level tilts it so the main floor is flat at z = 0; kind=set sets the transform
                {translation, rotation (x,y,z,w)}. Returns { ok: true }.
            params:
                kind:
                    type: string
                    description: rotate | level | set
                    required: true
                degrees:
                    type: number
                    description: 'for rotate: degrees about +z'
                transform:
                    type: object
                    description: 'for set: {translation [x, y, z], rotation [x, y, z, w]}'
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: GET
            path: 'api/sessions/{id}/floor'
            when: you need the floor height at places on each storey
            description: >-
                The local floor per storey: { mapVersion, cell, origin, width, height, storeys: [{ level, band, heights
                (a grid, null = unknown), measured }] }.
            params:
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: PUT
            path: 'api/sessions/{id}/slice'
            when: you want to show only a slab or box of the map
            description: >-
                Set (undoable) the slicer's view: { zMin, zMax, yaw, xMin, xMax, yMin, yMax } in map meters, or null /
                {} to clear it. Returns { ok: true }.
            params:
                zMin:
                    type: number
                    description: 'bottom of the slice, m'
                zMax:
                    type: number
                    description: 'top of the slice, m'
                yaw:
                    type: number
                    description: radians
                xMin:
                    type: number
                    description: 'm, along the slice''s yawed x'
                xMax:
                    type: number
                    description: 'm, along the slice''s yawed x'
                yMin:
                    type: number
                    description: 'm, along the slice''s yawed y'
                yMax:
                    type: number
                    description: 'm, along the slice''s yawed y'
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: GET
            path: 'api/sessions/{id}/alignment'
            when: you need the rotation that squares the walls to the axes
            description: 'The suggested yaw (radians) that lines the walls up with x and y: { yaw }.'
            params:
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/modify'
            when: 'you need to erase, draw or straighten walls on a floor'
            description: >-
                Brush edits on a storey (undoable), map-frame x, y meters. tool=erase: remove what stands on the floor
                along path [[x, y], ...] of radius, up to zEnd (m over the local floor when relative, default 1.8;
                fullColumn = everything up to the next storey): every voxel in the columns the brush touches goes but
                the floor (a lone speck goes in one click), nothing is added. tool=draw: add voxels along path of width
                (default 0.1) up to height (default 1 m). tool=straighten: replace a noisy wall along from..to (width
                band, default 0.4; up to zEnd, default 2.5) with one straight slab (thickness = the wall's own unless
                given). Returns { label, changed, remaining }.
            params:
                tool:
                    type: string
                    description: erase | draw | straighten
                    required: true
                floor:
                    type: integer
                    description: storey index
                    required: true
                path:
                    type: array
                    items:
                        type: array
                        items:
                            type: number
                    description: 'erase/draw: [[x, y], ...]'
                radius:
                    type: number
                    description: 'erase: brush radius, m'
                width:
                    type: number
                    description: 'draw/straighten: band width, m'
                height:
                    type: number
                    description: 'draw: wall height, m'
                from:
                    type: array
                    items:
                        type: number
                    description: 'straighten: [x, y]'
                to:
                    type: array
                    items:
                        type: number
                    description: 'straighten: [x, y]'
                thickness:
                    type: number
                    description: 'straighten: slab thickness, m'
                zEnd:
                    type: number
                    description: 'erase/straighten: how high it reaches, m (erase default 1.8, straighten 2.5)'
                relative:
                    type: boolean
                    description: zEnd over the local floor (default true)
                fullColumn:
                    type: boolean
                    description: 'erase/straighten: reach up to the next storey, ignoring zEnd'
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: GET
            path: 'api/sessions/{id}/annotations'
            when: 'you need the labelled boxes, points, areas or views on the map'
            description: >-
                Every annotation, by kind: boxes, planes, points, floors, planPoints (named plan points), areas, prisms,
                views (saved 2D views), the slice; each with its id.
            params:
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/annotations'
            when: 'you want to label an object, place, area or view on the map'
            description: >-
                Add an annotation (undoable). type=box {label, box}; plane {label, center, normal, size [w, h]}; point
                {label, position}; planPoint {floor, name, position [x, y]} (a named spot on a floor plan); area {floor,
                name, kind ("no-go" = navigation avoids it, "zone", ...), polygon [[x, y], ...]}; prism {floor, label,
                polygon, height (default 1), base?} (a polygon standing up from the local floor); view {name, floor,
                zMin, zMax, center?, follow} (a saved 2D view). label and name stand in for each other. source: who made
                it (default user; pass "agent"). Returns { id }.
            params:
                type:
                    type: string
                    description: box | plane | point | planPoint | area | prism | view
                    required: true
                label:
                    type: string
                    description: box / plane / point / prism label
                name:
                    type: string
                    description: planPoint / area / view
                box:
                    type: object
                    description: an oriented box in map-frame meters
                    properties:
                        center:
                            type: array
                            items:
                                type: number
                            minItems: 3
                            maxItems: 3
                        size:
                            type: array
                            items:
                                type: number
                            minItems: 3
                            maxItems: 3
                            description: 'full extents along the box''s x, y, z'
                        yaw:
                            type: number
                            description: radians about +z (default 0)
                    required:
                        - center
                        - size
                center:
                    type: array
                    items:
                        type: number
                    description: 'plane: [x, y, z]; view: [x, y]'
                normal:
                    type: array
                    items:
                        type: number
                    description: 'plane: [x, y, z]'
                size:
                    type: array
                    items:
                        type: number
                    description: 'plane: [w, h]'
                position:
                    type: array
                    items:
                        type: number
                    description: 'point: [x, y, z]; planPoint: [x, y]'
                floor:
                    type: integer
                    description: storey index
                kind:
                    type: string
                    description: 'area kind: no-go, zone, ...'
                polygon:
                    type: array
                    items:
                        type: array
                        items:
                            type: number
                    description: '[[x, y], ...]'
                height:
                    type: number
                    description: 'prism: m (default 1)'
                base:
                    type: number
                    description: 'prism: m over the local floor'
                zMin:
                    type: number
                    description: 'view: m (default 0.1)'
                zMax:
                    type: number
                    description: 'view: m (default 1.8)'
                follow:
                    type: boolean
                    description: 'view: z over the local floor (default true)'
                source:
                    type: string
                    description: user | agent
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: PATCH
            path: 'api/sessions/{id}/annotations/{annotation}'
            when: 'you need to rename, move or resize an annotation'
            description: >-
                Change an annotation's fields by id (undoable; the body is merged into it), e.g. {"label": "desk"} or
                {"box": {"center": [..], "size": [..], "yaw": 0}}. Returns { ok: true }.
            params:
                annotation:
                    type: string
                    description: annotation id
                    required: true
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: DELETE
            path: 'api/sessions/{id}/annotations/{annotation}'
            when: you want to remove an annotation
            description: 'Delete an annotation by id (undoable). Returns { ok: true }.'
            params:
                annotation:
                    type: string
                    description: annotation id
                    required: true
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/fit-box'
            when: you need a tight box around an object in a rough region
            description: >-
                The tightest oriented box around the non-floor voxels inside a rough box. Pass a generous region; the
                result hugs the object. Returns { box, voxels }; add=true also adds it as a box annotation (label,
                default "object"; source default agent) and returns its id.
            params:
                box:
                    type: object
                    description: an oriented box in map-frame meters
                    properties:
                        center:
                            type: array
                            items:
                                type: number
                            minItems: 3
                            maxItems: 3
                        size:
                            type: array
                            items:
                                type: number
                            minItems: 3
                            maxItems: 3
                            description: 'full extents along the box''s x, y, z'
                        yaw:
                            type: number
                            description: radians about +z (default 0)
                    required: true
                label:
                    type: string
                    description: for add (default "object")
                add:
                    type: boolean
                    description: also add the fitted box as an annotation
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/query'
            when: you need to know what voxels are in a region
            description: >-
                Probe the map: { count (voxels in the region), min / max corner, horizontalSurfaceVoxels,
                verticalSurfaceVoxels, sample (up to limit positions) }.
            params:
                region:
                    description: '"view" (the user''s current camera view), "all" (default), or a box {center, size, yaw}'
                    anyOf:
                        -
                            type: string
                            enum:
                                - view
                                - all
                        -
                            type: object
                            description: an oriented box in map-frame meters
                            properties:
                                center:
                                    type: array
                                    items:
                                        type: number
                                    minItems: 3
                                    maxItems: 3
                                size:
                                    type: array
                                    items:
                                        type: number
                                    minItems: 3
                                    maxItems: 3
                                    description: 'full extents along the box''s x, y, z'
                                yaw:
                                    type: number
                                    description: radians about +z (default 0)
                            required:
                                - center
                                - size
                limit:
                    type: integer
                    description: sample size (default 40)
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/find-objects'
            when: you need to find furniture or other objects on the floor
            description: >-
                Clusters of voxels standing on the floor (things like furniture) in a region: { objects: [{ box (tight),
                voxels, heightAboveFloor, footprint [x, y] }] }, largest first, at most 60. Floor, ceiling and walls are
                excluded. A good first step for 'box every chair'.
            params:
                region:
                    description: '"view" (the user''s current camera view), "all" (default), or a box {center, size, yaw}'
                    anyOf:
                        -
                            type: string
                            enum:
                                - view
                                - all
                        -
                            type: object
                            description: an oriented box in map-frame meters
                            properties:
                                center:
                                    type: array
                                    items:
                                        type: number
                                    minItems: 3
                                    maxItems: 3
                                size:
                                    type: array
                                    items:
                                        type: number
                                    minItems: 3
                                    maxItems: 3
                                    description: 'full extents along the box''s x, y, z'
                                yaw:
                                    type: number
                                    description: radians about +z (default 0)
                            required:
                                - center
                                - size
                minVoxels:
                    type: integer
                    description: smallest cluster kept (default 25)
                maxHeight:
                    type: number
                    description: 'ignore clusters taller than this above the floor (m), default 2'
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/plans'
            when: you need 2D floor plans made from the 3D map
            description: >-
                Make 2D floor plans (occupancy: walls/furniture vs free floor) from the 3D map (undoable), one per
                storey when multiFloor (default true), optionally at explicit floor heights. Returns { floors: [{ index,
                name, z }] }; GET .../plans/{floor} gives each.
            params:
                multiFloor:
                    type: boolean
                    description: one plan per storey (default true)
                levels:
                    type: array
                    items:
                        type: number
                    description: 'floor heights (m); default: found from the map'
                options:
                    type: object
                    description: >-
                        {resolution (m per pixel, default 0.05), obstacleMin (0.15), obstacleMax (1.8), floorBand
                        (0.12)}: meters over the floor
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: GET
            path: 'api/sessions/{id}/plans/{floor}'
            when: you need to see a floor plan or map its pixels to meters
            description: >-
                A floor plan (images[0]: white free, black occupied, grey unknown; +y up) with its z, origin,
                resolution, width, height and pixelToMeters so pixels map to meters, plus that floor's named points and
                areas. `{floor}.png` is the bare image.
            params:
                floor:
                    type: string
                    description: storey index (or `N.png` for the bare image)
                    required: true
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/undo'
            when: you want to undo the last edit
            description: 'Undo the last edit (anyone''s). Returns { undone: its label, or null }.'
            params:
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/redo'
            when: you want to redo an edit you undid
            description: 'Redo the last undone edit. Returns { redone: its label, or null }.'
            params:
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/save'
            when: you need to save the map and annotations into the recording
            description: >-
                Write the map and every annotation into the recording file (a background job, in place: an .mcap gets
                the new messages appended, nothing is copied; a recording in a read-only folder is refused). Returns {
                job }.
            params:
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
        -
            method: POST
            path: 'api/sessions/{id}/upload'
            when: you want to upload the recording to Dimensional cloud
            description: >-
                Upload the recording to Dimensional cloud through Desktop's upload queue (Desktop's
                /dimos-gateway/cloud/uploads shows progress; it waits for a login if there is none). Returns { upload };
                with unsaved edits and saveFirst (default true) it saves into it first and returns { job, note },
                queueing the upload when the save finishes. 503 when not started by Desktop.
            params:
                saveFirst:
                    type: boolean
                    description: save unsaved edits into the recording first (default true)
                id:
                    type: string
                    required: true
                    description: 'session id, or `current` (the recording open in the page)'
nix:
    cache:
        aarch64-linux:
            - packages.aarch64-darwin.dimosApp-aarch64-linux
            - packages.x86_64-linux.dimosApp-aarch64-linux
        x86_64-linux:
            - packages.aarch64-darwin.dimosApp-x86_64-linux
